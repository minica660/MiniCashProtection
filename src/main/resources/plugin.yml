name: MiniCashProtection
version: '${version}'
main: MiniCash.MiniCashProtection
api-version: '1.21'
author: MiniCash
description: 保護フラグを追加するプラグイン
load: POSTWORLD

depend:
  - WorldGuard
softdepend:
  - packetevents
  - GSit

permissions:
  minicashprotection.access.*:
    description: MiniCashProtection独自のアクセス権
    default: op
    children:
      minicashprotection.access.mp-block-place: true
      minicashprotection.access.useitemflame: true
      minicashprotection.access.elytra: true